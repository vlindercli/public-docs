site_name: VlinderCLI Blog
site_url: https://blog.vlindercli.dev
site_description: Updates, tutorials, and insights from the VlinderCLI team
site_author: VlinderCLI Contributors

docs_dir: content

theme:
  name: material
  custom_dir: overrides
  font:
    text: Inter
    code: JetBrains Mono
  palette:
    scheme: slate
    primary: indigo
    accent: deep purple
  features:
    - navigation.footer
    - content.code.copy
    - content.code.annotate
    - search.suggest
    - search.highlight
    - toc.follow

extra:
  analytics:
    provider: google
    property: G-XXXXXXXXXX
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/vlindercli/vlinder

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

plugins:
  - search
  - blog

nav:
  - Blog: index.md
  - Docs: https://docs.vlindercli.dev/
  - Slides: https://slides.vlindercli.dev/
  - Home: https://vlindercli.dev/

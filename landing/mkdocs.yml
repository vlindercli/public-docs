site_name: VlinderCLI
site_url: https://vlindercli.dev
site_description: Debug and Repair AI agents in production
site_author: VlinderCLI Contributors

repo_url: https://github.com/vlindercli/vlindercli
repo_name: vlindercli/vlindercli

theme:
  name: material
  custom_dir: overrides
  font:
    text: Inter
    code: JetBrains Mono
  palette:
    scheme: slate
    primary: indigo
    accent: deep purple
  features:
    - navigation.tabs
    - navigation.footer
    - content.code.copy

docs_dir: content

extra_css:
  - stylesheets/extra.css

extra:
  analytics:
    provider: google
    property: G-XXXXXXXXXX
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/vlindercli/vlindercli
    - icon: fontawesome/brands/discord
      link: https://discord.vlindercli.dev/

markdown_extensions:
  - attr_list
  - md_in_html
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

plugins:
  - search

nav:
  - Home: index.md
  - Docs: https://docs.vlindercli.dev/
  - Blog: https://blog.vlindercli.dev/
  - Slides: https://slides.vlindercli.dev/
  - Discord: https://discord.vlindercli.dev/

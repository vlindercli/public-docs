site_name: VlinderCLI Docs
site_url: https://docs.vlindercli.dev
site_description: AI agents that can time travel — documentation for VlinderCLI
site_author: VlinderCLI Contributors

repo_url: https://github.com/vlindercli/vlindercli
repo_name: vlindercli/vlindercli

docs_dir: content

theme:
  name: material
  custom_dir: overrides
  font:
    text: Inter
    code: JetBrains Mono
  palette:
    scheme: slate
    primary: indigo
    accent: deep purple
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.indexes
    - navigation.sections
    - navigation.top
    - navigation.footer
    - content.code.copy
    - content.code.annotate
    - search.suggest
    - search.highlight
    - search.share
    - toc.follow

extra_css:
  - stylesheets/extra.css

extra:
  analytics:
    provider: google
    property: G-XXXXXXXXXX
    feedback:
      title: Was this page helpful?
      ratings:
        - icon: material/thumb-up-outline
          name: This page was helpful
          data: 1
          note: >-
            Thanks for your feedback!
        - icon: material/thumb-down-outline
          name: This page could be improved
          data: 0
          note: >-
            Thanks for your feedback! Help us improve by
            <a href="https://github.com/vlindercli/vlinder/issues/new?title=[docs]+{title}+-+{url}" target="_blank" rel="noopener">opening an issue</a>.
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/vlindercli/vlindercli
    - icon: fontawesome/brands/discord
      link: https://discord.vlindercli.dev/

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

plugins:
  - search
  - minify:
      minify_html: true

nav:
  - Home: index.md
  - Contribute: contribute.md
  - Tutorials:
    - tutorials/index.md
    - Get Started: tutorials/getting-started.md
    - Adding Models: tutorials/adding-models.md
    - Your First Agent: tutorials/your-first-agent.md
    - Your First Fleet: tutorials/your-first-fleet.md
  - How-to Guides:
    - how-to/index.md
    - Installation: how-to/installation.md
    - Manage Models: how-to/manage-models.md
    - Storage: how-to/storage.md
    - Configuration: how-to/configuration.md
    - Time-Travel Debugging: how-to/time-travel-debugging.md
    - Observability: how-to/observability.md
    - Distributed Deployment: how-to/distributed-deployment.md
  - Explanation:
    - explanation/index.md
    - Architecture: explanation/architecture.md
    - Agents Model: explanation/agents-model.md
    - Timelines: explanation/timelines.md
    - Queue System: explanation/queue-system.md
    - Storage Model: explanation/storage-model.md
    - State Store: explanation/state-store.md
    - Conversations Repository: explanation/conversations-repo.md
    - Time Travel: explanation/time-travel.md
    - Domain Model: explanation/domain-model.md
  - Reference:
    - reference/index.md
    - CLI Commands:
      - Overview: reference/cli/index.md
      - vlinder agent: reference/cli/agent.md
      - vlinder fleet: reference/cli/fleet.md
      - vlinder model: reference/cli/model.md
      - vlinder session: reference/cli/session.md
      - vlinder turn: reference/cli/turn.md
      - vlinder secret: reference/cli/secret.md
      - vlinder daemon: reference/cli/daemon.md
    - Configuration:
      - agent.toml: reference/agent-toml.md
      - fleet.toml: reference/fleet-toml.md
      - model.toml: reference/model-toml.md
      - config.toml: reference/config-toml.md
      - Environment Variables: reference/environment-variables.md
    - Conversations Repository: reference/conversations-repo.md
    - Services: reference/services.md
  - Blog: https://blog.vlindercli.dev/
  - Slides: https://slides.vlindercli.dev/
  - Discord: https://discord.vlindercli.dev/
